name: Build and publish release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_ROLL_FORWARD: LatestMajor

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Program_Source/frontend/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Build frontend
        working-directory: Program_Source/frontend
        run: |
          npm ci
          npm run build

      - name: Publish application
        working-directory: Program_Source
        run: >-
          dotnet publish INT_VoiceToText.csproj
          -c Release -r win-x64 --self-contained true
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          -o ..\Program

      - name: Build updater helper
        run: >-
          dotnet publish Program_Source/Updater/INT_VoiceToText.Updater.csproj
          -c Release -r win-x64 --self-contained true
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          -o Program

      - name: Prepare portable Program
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force Program\library_words | Out-Null
          Copy-Item Program_Source\icon.ico,Program_Source\tray-blue.ico,Program_Source\tray-green.ico Program -Force
          Copy-Item Program_Source\library_words\words.txt Program\library_words\words.txt -Force
          Copy-Item Program_Source\Install-Requirements.ps1,Program_Source\Install-Requirements.bat Program -Force

          # ── Deploy native Whisper DLLs beside the exe (portable fallback) ──
          # CPU  → runtimes/win-x64/          (ONLY CPU DLLs — never a GPU DLL here!)
          # Vulkan → runtimes/vulkan/win-x64/ (its own subfolder)
          # The single-file exe ALSO self-extracts the same layout to %TEMP%\.net\...\.
          # A GPU DLL inside runtimes/win-x64/ makes whisper.dll load it even in CPU mode
          # and hard-crash (0xc0000409) on NVIDIA machines — so keep the folders isolated.
          $nativeDir = 'Program\runtimes\win-x64'
          $vulkanDir = 'Program\runtimes\vulkan\win-x64'
          New-Item -ItemType Directory -Force $nativeDir | Out-Null
          New-Item -ItemType Directory -Force $vulkanDir | Out-Null

          $nugetCache = ((dotnet nuget locals global-packages --list) -replace 'global-packages:\s*','').Trim()

          function Copy-Pkg($pkgName, $destDir) {
            $found = Get-ChildItem (Join-Path $nugetCache $pkgName) -Directory -ErrorAction SilentlyContinue |
                     Sort-Object Name -Descending | Select-Object -First 1
            if ($found) {
              $buildDir = Join-Path $found.FullName 'build\win-x64'
              if (Test-Path $buildDir) {
                Copy-Item "$buildDir\*.dll" $destDir -Force
                Write-Host "Copied $($found.Name) -> $destDir"
              }
            }
          }

          Copy-Pkg 'whisper.net.runtime' $nativeDir
          Copy-Pkg 'whisper.net.runtime.vulkan' $vulkanDir

          # CPU DLLs also at Program root as an extra fallback search path
          foreach ($d in @('whisper.dll','ggml-whisper.dll','ggml-base-whisper.dll','ggml-cpu-whisper.dll')) {
            if (Test-Path "$nativeDir\$d") { Copy-Item "$nativeDir\$d" Program -Force }
          }

          # ── Sanity: the CPU folder must never contain a GPU DLL ──
          foreach ($bad in @('ggml-cuda-whisper.dll','ggml-vulkan-whisper.dll')) {
            if (Test-Path "$nativeDir\$bad") {
              Remove-Item "$nativeDir\$bad" -Force
              Write-Host "REMOVED $bad from runtimes/win-x64/ (GPU DLL in CPU folder crashes on NVIDIA)"
            }
          }

          # ── Verify CPU DLLs exist ──
          $missing = @()
          foreach ($c in @('whisper.dll','ggml-whisper.dll','ggml-base-whisper.dll','ggml-cpu-whisper.dll')) {
            if (-not (Test-Path "$nativeDir\$c")) { $missing += $c }
          }
          if ($missing.Count -gt 0) { throw "MISSING CPU DLLs: $($missing -join ', ')" }

          Remove-Item Program\*.pdb -Force -ErrorAction SilentlyContinue
          Remove-Item Program\models -Recurse -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path Program -DestinationPath "INT_VoiceToText-${{ github.ref_name }}.zip" -CompressionLevel Optimal
          $zipSize = (Get-Item "INT_VoiceToText-${{ github.ref_name }}.zip").Length
          Write-Host "ZIP size: $([math]::Round($zipSize / 1MB, 1)) MB"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: INT_VoiceToText-${{ github.ref_name }}.zip
