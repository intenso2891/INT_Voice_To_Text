name: Build and publish release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_ROLL_FORWARD: LatestMajor

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Program_Source/frontend/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Build frontend
        working-directory: Program_Source/frontend
        run: |
          npm ci
          npm run build

      - name: Publish application
        working-directory: Program_Source
        run: >-
          dotnet publish INT_VoiceToText.csproj
          -c Release -r win-x64 --self-contained true
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          -o ..\Program

      - name: Build updater helper
        run: >-
          dotnet publish Program_Source/Updater/INT_VoiceToText.Updater.csproj
          -c Release -r win-x64 --self-contained true
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          -o Program

      - name: Prepare portable Program
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force Program\library_words | Out-Null
          Copy-Item Program_Source\icon.ico,Program_Source\tray-blue.ico,Program_Source\tray-green.ico Program -Force
          Copy-Item Program_Source\library_words\words.txt Program\library_words\words.txt -Force
          Copy-Item Program_Source\Install-Requirements.ps1,Program_Source\Install-Requirements.bat Program -Force

          $nativeDir = 'Program\runtimes\win-x64'
          $netNativeDir = 'Program\runtimes\win-x64\native'
          New-Item -ItemType Directory -Force $nativeDir | Out-Null
          New-Item -ItemType Directory -Force $netNativeDir | Out-Null

          # ── Source 1: build intermediate (dotnet preserves runtimes/) ──
          $binDir = 'Program_Source\bin\Release\net9.0-windows\win-x64'
          $binRt  = "$binDir\runtimes\win-x64\native"
          if (Test-Path $binRt) {
            Copy-Item "$binRt\*.dll" $nativeDir -Force
            Copy-Item "$binRt\*.dll" $netNativeDir -Force
            Copy-Item "$binRt\*.dll" Program -Force
            Write-Host "Copied from build intermediate: $binRt"
          }

          # ── Source 2: NuGet cache (whisper.net.runtime*) ──
          $nugetCache = ((dotnet nuget locals global-packages --list) -replace 'global-packages:\s*','').Trim()
          $whisperPkgs = @('whisper.net.runtime','whisper.net.runtime.vulkan','whisper.net.runtime.noavx')
          foreach ($pkg in $whisperPkgs) {
            $found = Get-ChildItem (Join-Path $nugetCache "$pkg") -Directory -ErrorAction SilentlyContinue |
                     Sort-Object Name -Descending | Select-Object -First 1
            if ($found) {
              $buildDir = Join-Path $found.FullName 'build\win-x64'
              if (Test-Path $buildDir) {
                Copy-Item "$buildDir\*.dll" $nativeDir -Force
                Copy-Item "$buildDir\*.dll" $netNativeDir -Force
                Write-Host "Copied from NuGet cache ($($found.Name)): $buildDir"
              }
            }
          }

          # ── Also copy CPU DLLs to Program root (Whisper.net fallback path) ──
          $rootDlls = @('whisper.dll','ggml-whisper.dll','ggml-base-whisper.dll','ggml-cpu-whisper.dll')
          foreach ($d in $rootDlls) {
            if (Test-Path "$nativeDir\$d") { Copy-Item "$nativeDir\$d" Program -Force }
          }

          # ── VERIFY critical DLLs exist ──
          $critical = @('whisper.dll','ggml-whisper.dll','ggml-base-whisper.dll','ggml-cpu-whisper.dll')
          $missing = @()
          foreach ($c in $critical) {
            $inRoot = Test-Path "Program\$c"
            $inNative = Test-Path "$nativeDir\$c"
            Write-Host "  $c root=$inRoot runtimes/win-x64=$inNative"
            if (-not $inNative) { $missing += $c }
          }
          if ($missing.Count -gt 0) { throw "MISSING critical native DLLs: $($missing -join ', ')" }

          # ── Report sizes ──
          $nativeSize = (Get-ChildItem $nativeDir -File | Measure-Object -Property Length -Sum).Sum
          $totalSize = (Get-ChildItem Program -Recurse -File | Measure-Object -Property Length -Sum).Sum
          Write-Host "runtimes/win-x64/native: $([math]::Round($nativeSize / 1MB, 1)) MB"
          Write-Host "Program total: $([math]::Round($totalSize / 1MB, 1)) MB"

          Remove-Item Program\*.pdb -Force -ErrorAction SilentlyContinue
          Remove-Item Program\models -Recurse -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path Program -DestinationPath "INT_VoiceToText-${{ github.ref_name }}.zip" -CompressionLevel Optimal
          $zipSize = (Get-Item "INT_VoiceToText-${{ github.ref_name }}.zip").Length
          Write-Host "ZIP size: $([math]::Round($zipSize / 1MB, 1)) MB"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: INT_VoiceToText-${{ github.ref_name }}.zip
