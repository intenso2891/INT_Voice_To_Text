name: Build and publish release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_ROLL_FORWARD: LatestMajor

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Program_Source/frontend/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Build frontend
        working-directory: Program_Source/frontend
        run: |
          npm ci
          npm run build

      - name: Publish application
        working-directory: Program_Source
        run: >-
          dotnet publish INT_VoiceToText.csproj
          -c Release -r win-x64 --self-contained true
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          -o ..\Program

      - name: Build updater helper
        run: >-
          dotnet publish Program_Source/Updater/INT_VoiceToText.Updater.csproj
          -c Release -r win-x64 --self-contained true
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          -o Program

      - name: Prepare portable Program
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force Program\library_words | Out-Null
          Copy-Item Program_Source\icon.ico,Program_Source\tray-blue.ico,Program_Source\tray-green.ico Program -Force
          Copy-Item Program_Source\library_words\words.txt Program\library_words\words.txt -Force
          Copy-Item Program_Source\Install-Requirements.ps1,Program_Source\Install-Requirements.bat Program -Force
          # ── Native Whisper DLLs (CRITICAL) ──
          # SingleFile bundles them inside the exe, but Whisper.net searches beside the exe.
          # Source 1: build intermediate (dotnet publish preserves bin/Release)
          $binDir = 'Program_Source\bin\Release\net9.0-windows\win-x64'
          $rtDir  = "$binDir\runtimes"
          if (Test-Path $rtDir) { Copy-Item $rtDir Program\runtimes -Recurse -Force }
          foreach ($d in 'whisper.dll','ggml-whisper.dll','ggml-base-whisper.dll','ggml-cpu-whisper.dll') {
            if (Test-Path "$binDir\$d") { Copy-Item "$binDir\$d" Program -Force }
          }
          # Source 2: NuGet cache — copy native DLLs to BOTH root and runtimes/win-x64/native/
          $nugetCache = ((dotnet nuget locals global-packages --list) -replace 'global-packages:\s*','').Trim()
          $whisperPkgs = @('whisper.net.runtime','whisper.net.runtime.cuda','whisper.net.runtime.cuda12','whisper.net.runtime.vulkan','whisper.net.runtime.noavx')
          # Whisper.net looks for DLLs in runtimes/win-x64/native/ (standard .NET convention)
          $nativeDir = 'Program\runtimes\win-x64\native'
          New-Item -ItemType Directory -Force $nativeDir | Out-Null
          foreach ($pkg in $whisperPkgs) {
            $buildDir = Join-Path $nugetCache "$pkg\1.9.1\build\win-x64"
            if (Test-Path $buildDir) {
              Copy-Item "$buildDir\*.dll" $nativeDir -Force
              Write-Host "Copied native DLLs from $pkg -> runtimes/win-x64/native/"
            }
          }
          # Also copy full runtimes tree from allruntimes package (CUDA, Vulkan, etc.)
          $allrt = Join-Path $nugetCache 'whisper.net.allruntimes\1.9.1'
          if (Test-Path $allrt) {
            Get-ChildItem $allrt -Directory -Filter 'runtimes' -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
              Copy-Item $_.FullName Program\runtimes -Recurse -Force
            }
          }
          # Re-copy native DLLs to the canonical path (overwrite if allruntimes overwrote them)
          foreach ($pkg in $whisperPkgs) {
            $buildDir = Join-Path $nugetCache "$pkg\1.9.1\build\win-x64"
            if (Test-Path $buildDir) { Copy-Item "$buildDir\*.dll" $nativeDir -Force }
          }
          # Also copy CPU runtime DLLs to Program root (Whisper.net fallback search path)
          $cpuBuild = Join-Path $nugetCache 'whisper.net.runtime\1.9.1\build\win-x64'
          if (Test-Path $cpuBuild) { Copy-Item "$cpuBuild\*.dll" Program -Force }
          # Verify critical DLLs exist
          $critical = @('whisper.dll','ggml-whisper.dll','ggml-base-whisper.dll','ggml-cpu-whisper.dll')
          foreach ($c in $critical) {
            if (-not (Test-Path "Program\$c")) { throw "MISSING critical native DLL: $c" }
          }
          Remove-Item Program\*.pdb -Force -ErrorAction SilentlyContinue
          Remove-Item Program\models -Recurse -Force -ErrorAction SilentlyContinue
          # Large V3 is downloaded once by the application and is not packed into Release.
          Compress-Archive -Path Program -DestinationPath "INT_VoiceToText-${{ github.ref_name }}.zip" -CompressionLevel Optimal

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: INT_VoiceToText-${{ github.ref_name }}.zip
