name: Build and publish release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_ROLL_FORWARD: LatestMajor

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Program_Source/frontend/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Build frontend
        working-directory: Program_Source/frontend
        run: |
          npm ci
          npm run build

      - name: Publish application
        working-directory: Program_Source
        run: >-
          dotnet publish INT_VoiceToText.csproj
          -c Release -r win-x64 --self-contained true
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          -o ..\Program

      - name: Build updater helper
        run: >-
          dotnet publish Program_Source/Updater/INT_VoiceToText.Updater.csproj
          -c Release -r win-x64 --self-contained true
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          -o Program

      - name: Prepare portable Program
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force Program\library_words | Out-Null
          Copy-Item Program_Source\icon.ico,Program_Source\tray-blue.ico,Program_Source\tray-green.ico Program -Force
          Copy-Item Program_Source\library_words\words.txt Program\library_words\words.txt -Force
          Copy-Item Program_Source\Install-Requirements.ps1,Program_Source\Install-Requirements.bat Program -Force

          # ── Native Whisper DLLs — CPU only (keep ZIP small) ──
          # Vulkan/CUDA runtimes are downloaded on demand by the app if GPU mode is selected.
          $nugetCache = ((dotnet nuget locals global-packages --list) -replace 'global-packages:\s*','').Trim()
          $nativeDir = 'Program\runtimes\win-x64\native'
          New-Item -ItemType Directory -Force $nativeDir | Out-Null

          # CPU runtime is ESSENTIAL — goes to both root and runtimes/win-x64/native/
          $cpuBuild = Join-Path $nugetCache 'whisper.net.runtime\1.9.1\build\win-x64'
          if (Test-Path $cpuBuild) {
            Copy-Item "$cpuBuild\*.dll" Program -Force
            Copy-Item "$cpuBuild\*.dll" $nativeDir -Force
            Write-Host "Copied CPU native DLLs from whisper.net.runtime"
          }

          # Vulkan runtime (optional GPU support, ~110MB for win-x64 only)
          $vulkanBuild = Join-Path $nugetCache 'whisper.net.runtime.vulkan\1.9.1\build\win-x64'
          if (Test-Path $vulkanBuild) {
            Copy-Item "$vulkanBuild\*.dll" $nativeDir -Force
            Write-Host "Copied Vulkan native DLLs from whisper.net.runtime.vulkan"
          }

          # Verify critical DLLs exist
          $critical = @('whisper.dll','ggml-whisper.dll','ggml-base-whisper.dll','ggml-cpu-whisper.dll')
          foreach ($c in $critical) {
            if (-not (Test-Path "Program\$c")) { throw "MISSING critical native DLL: $c" }
          }

          # Report size
          $totalSize = (Get-ChildItem Program -Recurse -File | Measure-Object -Property Length -Sum).Sum
          Write-Host "Program total: $([math]::Round($totalSize / 1MB, 1)) MB"

          Remove-Item Program\*.pdb -Force -ErrorAction SilentlyContinue
          Remove-Item Program\models -Recurse -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path Program -DestinationPath "INT_VoiceToText-${{ github.ref_name }}.zip" -CompressionLevel Optimal
          $zipSize = (Get-Item "INT_VoiceToText-${{ github.ref_name }}.zip").Length
          Write-Host "ZIP size: $([math]::Round($zipSize / 1MB, 1)) MB"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: INT_VoiceToText-${{ github.ref_name }}.zip
